[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --graceful-timeout 15 --keep-alive 5 --limit-request-line 4094 --limit-request-fields 100 --max-requests 1000 --max-requests-jitter 100"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
