# مثال فقط؛ عدّل upstream والدومين قبل الاستخدام.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 443 ssl http2;
    server_name example.com;
    client_max_body_size 50m;
    client_body_timeout 20s;
    keepalive_timeout 15s;
    limit_conn conn_per_ip 30;

    location ~* (^|/)(\.env|\.git|users\.json|settings\.json|.*\.(pem|key|p12|pfx|crt|secret))$ {
        deny all;
        return 404;
    }

    location = /login {
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_read_timeout 60s;
    }
}
